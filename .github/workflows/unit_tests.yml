name: Unit Tests

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    # A dev push already validates updates to a same-repository dev -> main PR.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.action != 'synchronize' ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      github.head_ref != 'dev' || github.base_ref != 'main'
    runs-on: ubuntu-latest
    env:
      PIP_ONLY_BINARY: mfem
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake libopenmpi-dev libgl1-mesa-dev

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install --only-binary=mfem "mfem==4.7.0.1" "numpy>=1.20,<2" pytest matplotlib

    - name: Install bfp
      run: python -m pip install .

    - name: Install coverage tools
      if: matrix.python-version == '3.11'
      run: python -m pip install pytest-cov coverage-badge

    - name: Run unit tests
      if: matrix.python-version != '3.11'
      run: pytest tests/unit/

    - name: Run unit tests with coverage
      if: matrix.python-version == '3.11'
      run: pytest tests/unit/ --cov=bfp --cov-report=term-missing

    - name: Generate coverage badge
      if: github.event_name == 'push' && matrix.python-version == '3.11'
      run: |
        mkdir -p .github/badges
        coverage-badge -o .github/badges/coverage.svg -f

    - name: Upload coverage badge
      if: github.event_name == 'push' && matrix.python-version == '3.11'
      uses: actions/upload-artifact@v4
      with:
        name: coverage-badge
        path: .github/badges/coverage.svg
        include-hidden-files: true
        if-no-files-found: error

  publish-coverage:
    needs: unit-tests
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: coverage-badge-${{ github.ref }}
      cancel-in-progress: false

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.ref_name }}

    - name: Check tested commit is still current
      id: current
      run: |
        if [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]; then
          echo "publish=true" >> "$GITHUB_OUTPUT"
        else
          echo "Branch advanced; skipping outdated coverage badge."
        fi

    - name: Download coverage badge
      if: steps.current.outputs.publish == 'true'
      uses: actions/download-artifact@v4
      with:
        name: coverage-badge
        path: .github/badges

    - name: Commit changed coverage badge
      if: steps.current.outputs.publish == 'true'
      run: |
        git add -- .github/badges/coverage.svg
        if git diff --cached --quiet -- .github/badges/coverage.svg; then
          echo "Coverage badge unchanged."
          exit 0
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git commit -m "Update coverage badge"
        # Pushes using GITHUB_TOKEN do not trigger another push workflow.
        git push origin "HEAD:$GITHUB_REF_NAME"
